name: atlas

services:
  postgres:
    image: postgres:18-alpine
    container_name: atlas-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: atlas
      POSTGRES_PASSWORD: atlas
      POSTGRES_DB: atlas
    ports:
      - '5432:5432'
    volumes:
      # Postgres 18+ images keep data in a versioned subdirectory of /var/lib/postgresql
      - atlas-pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U atlas -d atlas']
      interval: 5s
      timeout: 3s
      retries: 10

  # Separate instance for e2e tests: data is disposable, so no volume (tmpfs keeps it fast)
  postgres-test:
    image: postgres:18-alpine
    container_name: atlas-postgres-test
    restart: unless-stopped
    environment:
      POSTGRES_USER: atlas
      POSTGRES_PASSWORD: atlas
      POSTGRES_DB: atlas_test
    ports:
      - '5433:5432'
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U atlas -d atlas_test']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  atlas-pgdata:
